<div class="row mb-3">
  <div class="col-12">
    <div class="border">
      <div class="row">
        <div class="col-12">
          <button
            (click)="rowDelete()"
            class="card-actions"
            color="warn"
            mat-icon-button
          >
            <mat-icon>delete</mat-icon>
          </button>
          <button
            (click)="setIcon()"
            class="card-actions"
            color="primary"
            mat-icon-button
          >
            @if (!grid[0].component || !grid[0].scroll) {
              <mat-icon>add_photo_alternate</mat-icon>
            }
            @if (
              grid[0] &&
              grid[0].component &&
              grid[0].scroll &&
              grid[0].scroll.icon
            ) {
              <mat-icon>{{ grid[0].scroll.icon }}</mat-icon>
            }
          </button>
          <button
            (click)="addComponent(grid.length - 1)"
            class="card-actions"
            color="primary"
            mat-icon-button
            title="Add component to row"
          >
            <mat-icon>add_box</mat-icon>
          </button>
        </div>
      </div>
      <div
        class="row g-0"
        cdkDropList
        cdkDropListOrientation="horizontal"
        (cdkDropListDropped)="drop($event)"
      >
        @for (item of grid; track item; let i = $index) {
          <div [ngClass]="item.class" cdkDrag>
            <div class="p-1 h-100 position-relative">
              <div class="drag-handle" cdkDragHandle>
                <mat-icon>drag_indicator</mat-icon>
              </div>
              @if (i < grid.length - 1) {
                <div
                  class="resize-handle"
                  (mousedown)="onMouseDown($event, i)"
                ></div>
              }
              @if (!item.component) {
                <mat-card appearance="raised">
                  <div class="d-flex">
                    <button
                      (click)="openDialog(i)"
                      class="flex-grow-1"
                      color="primary"
                      mat-button
                    >
                      <mat-icon>add</mat-icon>
                    </button>
                    <button (click)="delete(i)" color="warn" mat-icon-button>
                      <mat-icon>delete</mat-icon>
                    </button>
                  </div>
                </mat-card>
              }
              @if (item.component) {
                <mat-card appearance="raised">
                  <mat-card-title>
                    <span>
                      {{ this.grid[i].componentConfigs.title }} -
                      <small
                        ><i>{{ word(item.component) }}</i></small
                      >
                    </span>
                    <button
                      class="card-actions"
                      (click)="delete(i)"
                      color="warn"
                      mat-icon-button
                    >
                      <mat-icon>delete</mat-icon>
                    </button>
                    <button
                      (click)="openDialog(i)"
                      class="card-actions"
                      mat-icon-button
                    >
                      <mat-icon>settings</mat-icon>
                    </button>
                  </mat-card-title>
                  <mat-card-content>
                    <div class="w-100">
                      <mat-icon>{{ icon(item.component) }}</mat-icon>
                    </div>
                  </mat-card-content>
                </mat-card>
              }
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
