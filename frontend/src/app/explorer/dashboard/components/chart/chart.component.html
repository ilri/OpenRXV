<mat-expansion-panel
  [expanded]="expandedStatus"
  (afterCollapse)="notifyExpanded(true)"
  (afterExpand)="notifyExpanded(false)"
>
  <mat-expansion-panel-header class="border-bottom-muted">
    @if (userSeesMe) {
      <mat-panel-title class="icon-with-text">
        <span class="mr-1">
          {{ title }}
        </span>
        <mat-icon
          aria-label="Button that displays
        a tooltip when focused or hovered over"
          cdkOverlayOrigin
          #trigger="cdkOverlayOrigin"
          (mouseenter)="popoverIsOpen = true"
          (mouseleave)="popoverIsOpen = false"
        >
          error
        </mat-icon>
        <ng-template
          cdkConnectedOverlay
          [cdkConnectedOverlayOrigin]="trigger"
          [cdkConnectedOverlayOpen]="popoverIsOpen"
        >
          <app-icons-with-text [text]="description"></app-icons-with-text>
        </ng-template>
      </mat-panel-title>
    }
  </mat-expansion-panel-header>

  <div class="chart-wrapper">
    @if (isMap) {
      @if (chartOptions?.series) {
        <highcharts-chart
          [Highcharts]="Highcharts"
          [options]="chartOptions"
          constructorType="mapChart"
          (chartInstance)="logChartInstance($event)"
        ></highcharts-chart>
      }
    }
    @if (!isMap) {
      @if (chartOptions?.series) {
        <highcharts-chart
          [Highcharts]="Highcharts"
          [options]="chartOptions"
          constructorType="chart"
          (chartInstance)="logChartInstance($event)"
        ></highcharts-chart>
      }
    }
    @if (isMap) {
      <div class="prevent-scroll" (click)="hideClickToEnable()" #clickToEnable>
        <span>Click to enable</span>
      </div>
    }
    <div class="panel-header-icons">
      @if (filterd) {
        <mat-icon
          class="mr-2"
          matTooltip="Reset Filter"
          matTooltipPosition="after"
          (click)="notifyFilter()"
        >
          autorenew
        </mat-icon>
      }
    </div>
  </div>

  <ng-content></ng-content>

  <ngx-spinner
    name="chartSpinner"
    bdColor="rgba(0, 0, 0, 0.1)"
    size="medium"
    color="var(--theme-primary-500)"
    type="ball-clip-rotate"
    [fullScreen]="false"
    [showSpinner]="!(loadingHits$ | async) && loading"
  ></ngx-spinner>
</mat-expansion-panel>
