<!-- the  *ngIf -->
<!-- the nouislider need to have range, min & max from the start -->
<!-- so i will render it when we have these values -->
@if (range) {
  <mat-label>{{ componentConfigs.placeholder }}</mat-label>
  <div class="d-flex">
    <mat-slider
      class="pb-4 w-100"
      [min]="min"
      [max]="max"
      [step]="1"
      [disabled]="disabled"
      discrete
    >
      <input
        matSliderStartThumb
        [(ngModel)]="range[0]"
        (dragEnd)="onYearSliderChange()"
      />
      <input
        matSliderEndThumb
        [(ngModel)]="range[1]"
        (dragEnd)="onYearSliderChange()"
      />
    </mat-slider>
  </div>
} @else {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}
